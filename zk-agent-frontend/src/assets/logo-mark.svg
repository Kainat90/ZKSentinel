  <rect x="48" y="84" width="4" height="4" rx="0.5" transform="rotate(45 50 86)" fill="rgba(255,255,255,0.5)"/>
  <rect x="55" y="84" width="4" height="4" rx="0.5" transform="rotate(45 57 86)" fill="rgba(255,255,255,0.5)"/>
