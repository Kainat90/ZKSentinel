<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" fill="none">
  <!-- Outer hexagon border -->
  <polygon
    points="100,8 185,55 185,149 100,196 15,149 15,55"
    fill="none"
    stroke="#7B1828"
    stroke-width="2"
  />
  <!-- Inner hexagon filled -->
  <polygon
    points="100,18 175,61 175,143 100,186 25,143 25,61"
    fill="#7B1828"
  />
  <!-- ZK text -->
  <text
    x="100"
    y="128"
    text-anchor="middle"
    font-family="'DM Sans', Arial, sans-serif"
    font-weight="700"
    font-size="72"
    fill="#FFFFFF"
    letter-spacing="-2"
  >ZK</text>
  <!-- Three small diamonds at bottom of hex -->
  <rect x="88"  y="170" width="7" height="7" rx="1" transform="rotate(45 91.5 173.5)" fill="rgba(255,255,255,0.5)"/>
  <rect x="100" y="170" width="7" height="7" rx="1" transform="rotate(45 103.5 173.5)" fill="rgba(255,255,255,0.5)"/>
  <rect x="112" y="170" width="7" height="7" rx="1" transform="rotate(45 115.5 173.5)" fill="rgba(255,255,255,0.5)"/>
  <!-- ZK SENTINEL text -->
  <text
    x="100"
    y="216"
    text-anchor="middle"
    font-family="'DM Sans', Arial, sans-serif"
    font-weight="700"
    font-size="18"
    fill="#7B1828"
    letter-spacing="2"
  ><tspan fill="#7B1828">ZK</tspan><tspan fill="#1a1a1a"> SENTINEL</tspan></text>
  <!-- Tagline -->
  <text
    x="100"
    y="230"
    text-anchor="middle"
    font-family="'DM Sans', Arial, sans-serif"
    font-weight="400"
    font-size="8"
    fill="#888888"
    letter-spacing="3"
  >TRUSTLESS  BY  DESIGN</text>
</svg>
